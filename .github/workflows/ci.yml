name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish a version for Dependabot callers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_NUMBER: ${{ github.run_number }}
        run: gh release create "v1.0.$RELEASE_NUMBER" --target "$RELEASE_SHA" --title "Maintenance v1.0.$RELEASE_NUMBER" --generate-notes
