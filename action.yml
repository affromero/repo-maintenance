name: Repository maintenance
description: Check dead code against reviewed exceptions and reject stale exceptions.
inputs:
  working-directory:
    description: Project directory relative to the checked-out repository.
    default: '.'
  report-name:
    description: Artifact name, unique when auditing multiple projects in one job.
    default: dead-code-reports
  prepare:
    description: Repository preparation command, run after npm ci.
    default: ''
  rust-paths:
    description: Space-separated crate directories for cargo-machete.
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
    - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
    - name: Install project dependencies
      if: hashFiles(format('{0}/package-lock.json', inputs.working-directory)) != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci
    - name: Prepare generated imports
      if: inputs.prepare != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PREPARE_COMMAND: ${{ inputs.prepare }}
      run: bash -e -o pipefail -c "$PREPARE_COMMAND"
    - name: Check Rust dependencies
      if: inputs.rust-paths != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        RUST_PATHS: ${{ inputs.rust-paths }}
      run: |
        version=$(python3 -c 'import json,os; print(json.load(open(os.environ["GITHUB_ACTION_PATH"] + "/tool-versions.json"))["cargo-machete"])')
        cargo install cargo-machete --version "$version" --locked
        read -r -a paths <<< "$RUST_PATHS"
        cargo machete "${paths[@]}"
    - name: Check source reachability
      if: success() || failure()
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/audit.py" --root "$PWD"
    - name: Upload reports
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.report-name }}
        path: ${{ inputs.working-directory }}/.maintenance-reports/
        include-hidden-files: true
        if-no-files-found: warn
